<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korrelator 3000</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="toolbar" aria-label="Kennzahlen-Auswahl">
      <div class="brand">
        <span>Korrelator 3000</span>
        <strong>Gepruefte Datenkandidaten</strong>
      </div>

      <label>
        Karte
        <select id="primaryMetric"></select>
      </label>

      <label>
        Vergleich
        <select id="secondaryMetric"></select>
      </label>
    </section>

    <section class="map-panel" aria-label="Interaktive Deutschlandkarte">
      <div id="map"></div>

      <aside class="info-panel" id="infoBox" aria-live="polite">
        <p class="eyebrow">MVP</p>
        <h1>Korrelator 3000</h1>
        <p>Oeffentliche Quellen sind hinterlegt, Kartenwerte bleiben bis zum Import Platzhalter.</p>
      </aside>

      <aside class="source-panel" id="sourceBox" aria-live="polite"></aside>
      <div class="status-message" id="statusMessage">Lade MVP...</div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
